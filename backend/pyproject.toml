[project]
name = "chatbot-backend"
version = "0.1.0"
description = "FastAPI backend for the chatbot application"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9,<3.0",
  "openai>=1.0,<3.0",
  "pydantic-settings>=2.0,<3.0",
  "fastapi>=0.115,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.30,<1.0"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.0,<9.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
